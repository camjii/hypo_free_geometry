[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hypo-free-geometry-recovery"
version = "0.0.1"
requires-python = ">=3.11"

[project.optional-dependencies]
activation = [
    "huggingface-hub>=0.23",
    "numpy>=1.26",
    "torch>=2.2",
    "transformers>=4.38",
]

[tool.setuptools]
py-modules = [
    "pipeline_draft",
    "concept_geometry",
    "clustering_algo",
    "compare",
    "ground_truth_comp",
    "null_cloud",
    "topology_metric",
    "calendar_date_validation",
    "activation_extraction",
    "prompt_templates",
]
